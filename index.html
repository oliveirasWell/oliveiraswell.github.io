<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Google tag (gtag.js). GA4 replaces the Universal Analytics property
         this site used to report to; UA stopped processing data in 2023, so
         those hits had been going nowhere. One page, no routing: gtag counts
         the pageview on load and needs no help from React. -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-XG7QCYN9FM"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-XG7QCYN9FM");
    </script>
    <meta name="theme-color" content="#100e0e" />
    <meta
      name="description"
      content="Wellington Oliveira - Senior Software Engineer with ten years building mobile and full-stack products in React Native, TypeScript, Node.js and Ruby on Rails. Available for remote work from GMT-4, overlapping EST and Pacific."
    />
    <link rel="canonical" href="https://oliveiraswell.github.io/" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;500;900&display=swap"
    />
    <title>
      Wellington Oliveira - Senior Software Engineer, React Native & TypeScript
    </title>

    <!-- Absolute URLs: crawlers and link unfurlers do not resolve relative ones. -->
    <meta property="og:type" content="profile" />
    <meta property="og:url" content="https://oliveiraswell.github.io/" />
    <meta
      property="og:title"
      content="Wellington Oliveira - Senior Software Engineer"
    />
    <meta
      property="og:description"
      content="Ten years building mobile and full-stack products - React Native, TypeScript, Node.js, Ruby on Rails. Available for remote work from GMT-4, overlapping EST and Pacific."
    />
    <meta
      property="og:image"
      content="https://oliveiraswell.github.io/og.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Wellington Oliveira, Senior Software Engineer"
    />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="pt_BR" />
    <meta property="profile:first_name" content="Wellington" />
    <meta property="profile:last_name" content="Oliveira" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@oliveiraswell" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
